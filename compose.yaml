name: system-design-learning

services:
  postgres:
    image: postgres:18.6
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${SD_POSTGRES_USER:-sd_learner}
      POSTGRES_PASSWORD: ${SD_POSTGRES_PASSWORD:-sd_learning_local_only}
      POSTGRES_DB: ${SD_POSTGRES_DB:-sd_learning}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${SD_POSTGRES_PORT:-55434}:5432"
    volumes:
      - sd-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    labels:
      com.rahulyadav.learning-system: system-design
      com.rahulyadav.disposable: "true"

volumes:
  sd-postgres-data:
    name: system-design-learning-postgres-18
    labels:
      com.rahulyadav.learning-system: system-design
      com.rahulyadav.disposable: "true"
