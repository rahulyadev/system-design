name: sd-beg-070-t02

services:
  shard_am:
    image: mysql:8.4.11
    profiles: ["lab"]
    command:
      - --server-id=711
      - --innodb-flush-log-at-trx-commit=1
    environment:
      MYSQL_ROOT_PASSWORD: sd_beg_070_t02_root_local
      MYSQL_DATABASE: sd_beg_070_t02
      MYSQL_USER: app
      MYSQL_PASSWORD: sd_beg_070_t02_app_local
    ports:
      - "127.0.0.1:55711:3306"
    volumes:
      - sd-beg-070-t02-am-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 15s
    stop_grace_period: 20s
    labels:
      com.rahulyadav.learning-task: SD-BEG-070-T02
      com.rahulyadav.disposable: "true"

  shard_nz:
    image: mysql:8.4.11
    profiles: ["lab"]
    command:
      - --server-id=712
      - --innodb-flush-log-at-trx-commit=1
    environment:
      MYSQL_ROOT_PASSWORD: sd_beg_070_t02_root_local
      MYSQL_DATABASE: sd_beg_070_t02
      MYSQL_USER: app
      MYSQL_PASSWORD: sd_beg_070_t02_app_local
    ports:
      - "127.0.0.1:55712:3306"
    volumes:
      - sd-beg-070-t02-nz-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 15s
    stop_grace_period: 20s
    labels:
      com.rahulyadav.learning-task: SD-BEG-070-T02
      com.rahulyadav.disposable: "true"

volumes:
  sd-beg-070-t02-am-data:
    name: sd-beg-070-t02-am-mysql-8-4
    labels:
      com.rahulyadav.learning-task: SD-BEG-070-T02
      com.rahulyadav.disposable: "true"
  sd-beg-070-t02-nz-data:
    name: sd-beg-070-t02-nz-mysql-8-4
    labels:
      com.rahulyadav.learning-task: SD-BEG-070-T02
      com.rahulyadav.disposable: "true"
