name: sd-beg-110-t01

services:
  redis:
    image: redis:8.10.1
    profiles: ["lab"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:55110:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    stop_grace_period: 10s
    labels:
      com.rahulyadav.learning-task: SD-BEG-110-T01
      com.rahulyadav.disposable: "true"

  postgres:
    image: postgres:18.6
    profiles: ["lab"]
    environment:
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: sd_beg_110_t01_postgres_local
      POSTGRES_DB: sd_beg_110_t01
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:55111:5432"
    volumes:
      - sd-beg-110-t01-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 10s
    stop_grace_period: 20s
    labels:
      com.rahulyadav.learning-task: SD-BEG-110-T01
      com.rahulyadav.disposable: "true"

volumes:
  sd-beg-110-t01-postgres-data:
    name: sd-beg-110-t01-postgres-18
    labels:
      com.rahulyadav.learning-task: SD-BEG-110-T01
      com.rahulyadav.disposable: "true"
